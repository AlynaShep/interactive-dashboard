<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A_Shepherd_Coding_Exam</title>
</head>
<body>
    <p>Alyna Shepherd</p>
    <p>aashepherd1@my.waketech.edu</p>
    <p>10/14/2026</p>

    <script defer>

        function amortizationCaluclator(){
            let loanAmount = prompt("Enter your loan amount (without commas): ");
            let termAmount = prompt("Enter your loan term in years (30 or 15)");

            if (termAmount != 15 && termAmount != 30){
                window.alert("Error: loan term must be either 15 or 30 years!")
                return;
            }

            let interestRate = 0.0575;
            let monthlyPayment;
            let totalInterest;
            let mortgageAmount;
            let totalMonths = termAmount * 12;

            loanAmount = Number(loanAmount);
            termAmount = Number(termAmount);

            monthlyPayment = (((interestRate/12)*loanAmount)/(1 - Math.pow(1 +(interestRate/12), (termAmount * -12))));
            totalInterest = (monthlyPayment * termAmount * 12)-loanAmount;
            mortgageAmount = loanAmount + totalInterest;


            let monthlyBalance = mortgageAmount;
            let currentMonth = 1;
            let tableRef = document.getElementById("amortization-table");


            document.getElementById("mortgage-term").innerHTML = "Mortgage term in years: " + termAmount.toFixed(2);
            document.getElementById("interest-rate").innerHTML = "Mortgage interest rate: " + interestRate * 100 + "%";
            document.getElementById("mortgage-amount").innerHTML = "Mortgage amount: " + mortgageAmount.toFixed(2);
            document.getElementById("total-interest").innerHTML = "Total interest amount: " + totalInterest.toFixed(2);
            document.getElementById("total-mortgage-amount").innerHTML = "Total mortgage amount: " + mortgageAmount.toFixed(2);

            while (monthlyBalance > 0 && currentMonth <= totalMonths)
            {
                let newRow = document.createElement("tr");
                let month = document.createElement("td");
                let payment = document.createElement("td");
                let balance =  document.createElement("td");

                monthlyBalance = monthlyBalance - monthlyPayment;

                if (monthlyBalance < 0){
                    monthlyBalance = 0;
                }


                month.append(currentMonth++);
                payment.append(monthlyPayment.toFixed(2));
                balance.append(monthlyBalance.toFixed(2));

                tableRef.appendChild(newRow);
                newRow.appendChild(month);
                newRow.appendChild(payment);
                newRow.appendChild(balance);

                if(monthlyBalance <=0){
                    break;
                }

            }


            // if balance reaches 0:
            if (monthlyBalance == 0){
                document.getElementById("end").innerHTML = "This is the Ending amortization Calculator...";
            }
            



        };
        

    </script>

    <div>
        <label>Activate Calculator</label>
        <button id="Button1" onclick="amortizationCaluclator()">----</button>

        <p id="mortgage-term"></p>
        <p id="interest-rate"></p>
        <p id="mortgage-amount"></p>
        <p id="total-interest"></p>
        <p id="total-mortgage-amount"></p>
        <p id="monthly-payment"></p>
        <p id="monthly-balance"></p>
        <p id="end"></p>

        <table id="amortization-table">
            <tr>
                <th>Month</th>
                <th>Monthly Payment</th>
                <th>Monthly Balance</th>
            </tr>

        </table>
    </div>
</body>
</html>

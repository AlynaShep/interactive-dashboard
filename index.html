<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Interactive Dashboard - Shepherd</title>
    <!-- Bootstrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <h1>My Interactive Dashboard</h1>
    <p>
        This dashboard was created by Alyna Shepherd for the WEB-115 course at Wake Tech
    </p>
    <link rel="stylesheet" href="css/style.css">
    <script>
        document.write("This dashboard demonstrates how JavaScript can be used to create interactive websites");
    </script>
    <!--The <noscript> is for web browsers with JavaScript rendering disabled-->
    <noscript>
        Unfortunately, your web browser does not support JavaScript
    </noscript>
    <div class="container">
        <div class="row">
            <!-- Dashboard Content -->
            <div class="col" id="weekly-tasks">
                <script defer src="js/task-manager.js"></script>
                <form>
                    <label>Name:</label>
                    <input type="text" id="name">
                    <br>
                    <label>Daily Task Goal:</label>
                    <input type="number" id="daily-goal">
                    <br>
                    <label>Weekly Bonus Tasks:</label>
                    <input type="number" id="bonus-tasks">
                    <br>
                    <button id="goal-btn">Submit</button>
                </form>
                <p id="goal-message"></p>
            </div>
            <div class="col" id="metric-converter">
                <script defer src="js/metric-converter.js"></script>
                <form>
                    <label>Value:</label>
                    <input type="float" id="value">
                    <br>
                    <label>Conversion Type:</label>
                    <select id="conversions">
                        <option value="in to cm">inches to centimeters.</option>
                        <option value="ft to cm">feet to centimeters</option>
                        <option value="yd to m">yards to meters</option>
                        <option value="mi to km">miles to kilometers</option>
                        <option value="cm to in">centimeters to inches</option>
                        <option value="cm to ft">centimeters to feet</option>
                        <option value="m to yd">meters to yards</option>
                        <option value="km to mi">kilometers to miles</option>
                    </select>
                    <br>
                    <label>Perform Conversion</label>
                    <button id="convert-btn">Convert</button>
                </form>
                <br>
                <p id="conversion-output"></p>

            </div>

            <div class="col" id="magic-eight-ball"> 
                <script src="M6-AssignmentFiles/js/magic-eight-ball.js" defer></script>﻿
                <link rel="stylesheet" href="M6-AssignmentFiles/css/magic-eight-ball.css">
                <h2 class="heading">Magic Eight Ball</h2>
                <form>
                    <p>Type a yes/no question below, then click on the Eight Ball below to get your answer!</p>
                    <input id="question" name="question" size="80">
                    <div id="magicEightBall">
                        <div id="circle"></div>
                        <img id="ball" src="M6-AssignmentFiles/img/magic-eight-ball.png" />
                    </div>
                    <button id="reset" name="reset" type="reset">Ask another question</button>
                    <button id="addResponse" name="addResponse">Add a new possible response to 8-ball</button>
                </form>
                <br>
            </div>
        </div>
    </div>
</body>

</html>
